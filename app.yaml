command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - 0.0.0.0

env:
  - name: TARGET_TABLE
    value: lr_serverless_aws_us_catalog.delta_row_editor.customers
  - name: AUDIT_TABLE
    value: lr_serverless_aws_us_catalog.delta_row_editor.customers_audit
  - name: PK_COLUMN
    value: customer_id
  - name: WAREHOUSE_ID
    value_from: warehouse
